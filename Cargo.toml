[workspace]
resolver = "3"
members = [
    "crates/craftward-core",
    "crates/craftward-cli",
    "crates/craftward-app",
    "crates/craftward-net",
    "crates/craftward-store",
]

[workspace.package]
version = "0.1.0"
authors = ["Deniz Yayvan"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/YaDe1804/craftward"
rust-version = "1.100.0"

[workspace.dependencies]
craftward-core = { path = "crates/craftward-core" }
craftward-net = { path = "crates/craftward-net" }
craftward-store = { path = "crates/craftward-store" }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
