# Dependency policy for Craftward, checked with cargo-deny 0.20.2.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Collect metadata with `--all-features`, so optional crates such as schemars
# are part of the graph. A true value cannot be turned off from the command
# line, which keeps `cargo deny check` the same locally and in CI.
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
all-features = true

[advisories]
# Vulnerability advisories always fail in cargo-deny 0.20. The old
# `vulnerability` key was removed and setting it is a configuration error.
unmaintained = "all"
# Temporary: accesskit on Linux still depends on zbus 5, which pulls the
# standalone crates that RustSec marks unmaintained after the merge into
# zbus 6. Remove these ignores when Dependabot (or a manual update) moves
# accesskit onto zbus 6. See ADR 0023.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "unmaintained: zvariant merged into zbus 6; pulled in by accesskit via zbus 5; no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained: zbus_names merged into zbus 6; pulled in by accesskit via zbus 5; no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained: zvariant_derive merged into zbus 6; pulled in by accesskit via zbus 5; no vulnerability" },
]

[licenses]
# Anything absent from this list fails the check, including GPL, AGPL, and LGPL.
# Unused entries stay quiet: this is the allowed set for future crates.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

# Bundled egui fonts only. Do not add OFL-1.1 or Ubuntu-font-1.0 to `allow`.
# See ADR 0023.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[sources]
# The default allow-registry is crates.io. Every other registry or git source fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unused-allowed-source = "allow"

[bans]
multiple-versions = "warn"
